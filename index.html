<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Gemarose ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --pink: #ffafcc;
            --hot-pink: #ff2e63;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffc8dd 0%, #ffafcc 100%);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Floating Heart Background */
        .heart-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .heart-shape {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            animation: float 6s infinite linear;
            font-size: 20px;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Main Card */
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            backdrop-filter: blur(10px);
            z-index: 10;
            border: 4px solid white;
            width: 85%;
            max-width: 400px;
            position: relative;
        }

        .main-gif { 
            width: 150px; 
            border-radius: 20px; 
            margin-bottom: 20px; 
        }

        h1 { color: #d90429; font-size: 1.8rem; margin: 0 0 10px 0; }
        .subtext { color: #ff4d6d; font-size: 1.1rem; margin-bottom: 25px; }

        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 80px;
            position: relative;
        }

        button {
            padding: 12px 28px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: var(--hot-pink);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 46, 99, 0.4);
            z-index: 20;
        }

        #noBtn {
            background-color: #ffffff;
            color: var(--hot-pink);
            border: 2px solid var(--hot-pink);
            position: relative;
            z-index: 15;
        }

        /* Pop-up Modal */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: white;
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            width: 80%;
            max-width: 320px;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        .modal h2 { color: var(--hot-pink); margin-bottom: 10px; }
        .modal p { color: #555; margin-bottom: 20px; line-height: 1.5; }
        .modal img { width: 180px; border-radius: 15px; }
    </style>
</head>
<body>

    <div class="heart-bg" id="heartBg"></div>

    <div class="container">
        <!-- RESTORED ORIGINAL FIRST GIF -->
        <img class="main-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpobjZid294M3p6Y3p6M3p6Y3p6M3p6Y3p6M3p6Y3p6M3p6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/KztT2c4u8mYYUiMKdJ/giphy.gif" alt="cute bear">
        <h1>Hi Gemarose! ❤️</h1>
        <p class="subtext">Will you be my Valentine?</p>
        
        <div class="button-group">
            <button id="yesBtn" onclick="showSurprise()">YES!</button>
            <button id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton()">No</button>
        </div>
    </div>

    <!-- The Success Pop-up -->
    <div id="overlay">
        <div class="modal">
            <!-- NEW STABLE MODAL GIF -->
            <img src="https://media.tenor.com/gU_pSp96pYgAAAAi/bear-kiss-bear-love.gif" alt="celebration">
            <h2>Yay! Gemarose! ❤️</h2>
            <p>I'm so happy! See you soon!<br><strong>- Dominic</strong></p>
            <button onclick="closeModal()" style="background:#f0f0f0; border:none; padding:10px 20px; border-radius:20px; cursor:pointer;">Close</button>
        </div>
    </div>

    <script>
        // Floating Hearts
        const heartBg = document.getElementById('heartBg');
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-shape');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heartBg.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 500);

        // Runaway Button Logic (Stays near middle)
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const randomX = Math.floor(Math.random() * 200) - 100; 
            const randomY = Math.floor(Math.random() * 150) - 75;  
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function showSurprise() {
            document.getElementById('overlay').style.display = 'flex';
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function closeModal() {
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
