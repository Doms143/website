<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Valentine ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --pink: #ffafcc;
            --hot-pink: #ff2e63;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ffc8dd 0%, #ffafcc 100%);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Floating Heart Background */
        .heart-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .heart-shape {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            animation: float 6s infinite linear;
            font-size: 20px;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Main Center Card */
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            backdrop-filter: blur(10px);
            z-index: 10;
            border: 4px solid white;
            max-width: 400px;
            width: 90%;
        }

        .main-gif { width: 180px; border-radius: 20px; margin-bottom: 20px; }
        h1 { color: #d90429; font-size: 1.8rem; margin: 0; margin-bottom: 20px; }

        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 60px; /* Space for the runaway button */
        }

        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            transition: transform 0.2s, background-color 0.3s;
            font-weight: bold;
        }

        #yesBtn {
            background-color: var(--hot-pink);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 46, 99, 0.4);
            z-index: 11; /* Always stays on top */
        }

        #noBtn {
            background-color: #ffffff;
            color: var(--hot-pink);
            border: 2px solid var(--hot-pink);
            transition: 0.1s ease; /* Faster move */
        }

        /* The Custom Pop-up Modal */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 320px;
        }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        .modal h2 { color: var(--hot-pink); margin: 15px 0; }
        .modal img { width: 150px; border-radius: 15px; }
    </style>
</head>
<body>

    <div class="heart-bg" id="heartBg"></div>

    <div class="container">
        <img class="main-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpobjZid294M3p6Y3p6M3p6Y3p6M3p6Y3p6M3p6Y3p6M3p6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/KztT2c4u8mYYUiMKdJ/giphy.gif" alt="cute bear">
        <h1>Will you be my Valentine? 🌹</h1>
        
        <div class="button-group">
            <!-- Clicking Yes triggers the confetti and pop-up -->
            <button id="yesBtn" onclick="showSurprise()">YES!</button>
            
            <!-- Hovering or Clicking No makes it run away -->
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <!-- The Success Pop-up -->
    <div id="overlay">
        <div class="modal">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNmc4dzJ4ZmxueG95ZXV6Z2p6eHh6eHh6eHh6eHh6eHh6eHh6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/l41lTfuxV6M9rY79e/giphy.gif" alt="celebration">
            <h2>Yay! See you soon! ❤️</h2>
            <button onclick="closeModal()" style="margin-top:15px; background:#eee; font-size: 14px; padding: 10px 20px;">Close</button>
        </div>
    </div>

    <script>
        // Floating Hearts
        const heartBg = document.getElementById('heartBg');
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-shape');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heartBg.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 400);

        // THE RUNAWAY BUTTON LOGIC
        function moveButton() {
            const btn = document.getElementById('noBtn');
            
            // Get screen dimensions minus button size so it doesn't go off-screen
            const maxWidth = window.innerWidth - btn.offsetWidth;
            const maxHeight = window.innerHeight - btn.offsetHeight;

            // Generate random coordinates
            const randomX = Math.floor(Math.random() * maxWidth);
            const randomY = Math.floor(Math.random() * maxHeight);

            // Change position to absolute and move it
            btn.style.position = 'absolute';
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        // SHOW THE SURPRISE
        function showSurprise() {
            document.getElementById('overlay').style.display = 'flex';
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function closeModal() {
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
