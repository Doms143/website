<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This tag is the most important for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Valentine ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --pink: #ffafcc;
            --hot-pink: #ff2e63;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffc8dd 0%, #ffafcc 100%);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden; /* Prevents scrolling when the button jumps */
            touch-action: manipulation; /* Prevents double-tap zoom delay */
        }

        /* Moving Heart Background */
        .heart-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .heart-shape {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            animation: float 6s infinite linear;
            font-size: 20px;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Responsive Container */
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            backdrop-filter: blur(10px);
            z-index: 10;
            border: 4px solid white;
            width: 85%; /* Fluid width for mobile */
            max-width: 400px;
        }

        .main-gif { 
            width: 150px; /* Smaller for mobile by default */
            border-radius: 20px; 
            margin-bottom: 20px; 
        }

        h1 { 
            color: #d90429; 
            font-size: 1.5rem; /* Scaled down for mobile */
            margin: 0 0 20px 0; 
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            min-height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: var(--hot-pink);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 46, 99, 0.4);
        }

        #noBtn {
            background-color: #ffffff;
            color: var(--hot-pink);
            border: 2px solid var(--hot-pink);
            position: relative;
        }

        /* --- MEDIA QUERIES for larger screens --- */
        @media (min-width: 600px) {
            h1 { font-size: 2rem; }
            .main-gif { width: 180px; }
            button { padding: 15px 35px; font-size: 1.1rem; }
        }

        /* Pop-up Modal Styling */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: white;
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            width: 80%;
            max-width: 300px;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        .modal h2 { color: var(--hot-pink); font-size: 1.5rem; }
        .modal img { width: 130px; border-radius: 15px; }
    </style>
</head>
<body>

    <div class="heart-bg" id="heartBg"></div>

    <div class="container" id="mainCard">
        <img class="main-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpobjZid294M3p6Y3p6M3p6Y3p6M3p6Y3p6M3p6Y3p6M3p6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/KztT2c4u8mYYUiMKdJ/giphy.gif" alt="cute bear">
        <h1>Will you be my Valentine? 🌹</h1>
        
        <div class="button-group">
            <button id="yesBtn" onclick="showSurprise()">YES!</button>
            <!-- touchstart is key for mobile responsiveness -->
            <button id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton()">No</button>
        </div>
    </div>

    <div id="overlay">
        <div class="modal">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNmc4dzJ4ZmxueG95ZXV6Z2p6eHh6eHh6eHh6eHh6eHh6eHh6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/l41lTfuxV6M9rY79e/giphy.gif" alt="celebration">
            <h2>Yay! See you soon! ❤️</h2>
            <button onclick="closeModal()" style="margin-top:15px; background:#f0f0f0; border:none; padding:10px 20px; border-radius:20px;">Close</button>
        </div>
    </div>

    <script>
        // Floating Hearts Background
        const heartBg = document.getElementById('heartBg');
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-shape');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heartBg.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 500);

        // Runaway Button Logic
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const padding = 20; // Keep it away from the extreme edges
            
            // Calculate boundaries so it stays visible on the screen
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed'; // Fixed works better for "jumping" around the whole screen
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function showSurprise() {
            document.getElementById('overlay').style.display = 'flex';
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function closeModal() {
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
